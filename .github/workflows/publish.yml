# Publishes to PyPI when a GitHub Release is published (e.g. from tag v0.1.0).
# Uses PyPI trusted publishing: no password or API token is stored in the repo.
# One-time setup on pypi.org: add a pending trusted publisher for
#   owner krishanSKDA, repo api-contract-sync, workflow publish.yml, environment pypi.
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/api_contract_sync/__init__.py').read()).group(1))")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match __version__ $version in src/api_contract_sync/__init__.py"
            exit 1
          fi

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/api-contract-sync
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
